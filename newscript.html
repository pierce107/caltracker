<!DOCTYPE html>
<html>
<head>
<title>Title of the document</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<style>
.container {
  width: 100%;
  padding: 15px;
}
/* Grundlegende Styling-Regeln */

html, body {
  height: 100%;
  margin: 0;
  background-color: beige;
}

body {
  font-family: Arial, sans-serif;
}



/* ---------------------------------- */
/* MOBILE STYLES (Standard)           */
/* ---------------------------------- */


/* Das Menü im mobilen Zustand */
.nav-menu {
  display: none; 
  background-color: #333;
  list-style: none;
}
.page-container-for-desktop {
    display: none;
}
.page-container-for-mobile {
  display: flex;
  flex-direction: row;
  min-height: 100vh;
}
.content {
  flex: 1; /* Das ist der Trick: Er "schiebt" den Footer nach unten */
  padding: 20px;
}
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background-color: #ffffff;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid #ddd;
}
.nav-item {
  display: flex;
  flex-direction: column; /* Icon oben, Text unten */
  align-items: center;   /* Horizontal zentrieren */
  text-decoration: none;
  color: #333;
  font-size: 0.85rem;
  gap: 4px; /* Abstand zwischen Icon und Text */
}

.nav-item i {
  font-size: 1.25rem; /* Größe der Icons */
}

.nav-menu a:hover {
  background-color: #555;
}
.box {
    margin-right: 40px;
    width: 100%;
    position: relative;
    right: 50px;
    height: 100px;
    margin-top: 80px;
    padding: 5px;
    border: 2px solid blue;
    border-radius: 10%;
}

/* ---------------------------------- */
/* DESKTOP STYLES (ab 768px Breite)   */
/* ---------------------------------- */
@media (min-width: 768px) {
  .footer {
    display: none;
  }
  .page-container-for-mobile {
    display: none;
  }
  .page-container-for-desktop {
    display: flex;
    flex-direction: column;
    min-height: 100vh; /* Nimmt mindestens die volle Bildschirmhöhe ein */
  }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #d32a2a;
    padding: 1rem 1.5rem;
    color: white;
    position: sticky;
  }
  /* Menü nebeneinander anzeigen */
  .nav-menu {
    display: flex !important;
    position: static;
    flex-direction: row;
    width: auto;
    padding: 0;
  }

  .nav-menu li {
    padding: 0;
    margin-left: 1.5rem;
  }

  .nav-menu a:hover {
    background-color: transparent;
    text-decoration: underline;
  }
}
</style>
<body>
<div class="page-container-for-desktop">
  <!-- Header / Inhalt -->
  <header class="date">1 November 2026</header>
  
  <main class="content">
    <p>Heute</p>
  </main>
</div>
<div class="page-container-for-mobile">
  <!-- Header / Inhalt -->
  <header class="date">1 November 2026</header>
  
  <main class="content">
    <p>Heute</p>
  </main>
  <div class="box">test</div>
  <div class="box">test</div>

  <!-- Der Footer, der unten bleiben soll -->
  <footer class="footer">
    <a href="#uebersicht" class="nav-item">
        <i class="fa-solid fa-chart-column"></i>
        <span>Übersicht</span>
    </a>
    
    <a href="#lebensmittel" class="nav-item">
        <i class="fa-solid fa-bars"></i>
        <span>Lebensmittel</span>
    </a>
    
    <a href="#profil" class="nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profil</span>
  </a>
  </footer>
</div>
</body>

</html>
