<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Übersicht</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Icon Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Verknüpfung zur ausgelagerten CSS-Datei -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="page-container-for-mobile">
    <header class="date">Heute, {{ date }}</header>
    
    <div class="box-wrapper">
      <div class="box">
        <h4>Kalorien</h4>
        <div class="value">1.640 <span class="sub">/ 2.400</span></div>
        <p class="info">noch 760 kcal</p>
      </div>
      <div class="box">
        <h4>Protein</h4>
        <div class="value">112 g <span class="sub">/ 150</span></div>
        <p class="info">noch 38 g</p>
      </div>
    </div>

    <div class="quick-selection">
      <p class="section-title">Schnellauswahl</p>
      <div class="tag-container">
        <div class="food-tag"><i class="bi bi-plus-lg"></i> Haferflocken</div>
        <div class="food-tag"><i class="bi bi-plus-lg"></i> Magerquark</div>
        <div class="food-tag"><i class="bi bi-plus-lg"></i> Hähnchenbrust</div>
        <div class="food-tag"><i class="bi bi-plus-lg"></i> Mehl</div>
        <div class="food-tag"><i class="bi bi-plus-lg"></i> Eier</div>
      </div>
    </div>

    <div class="list-of-meals">
      <div class="meal-tag">Frühstück <i class="bi bi-plus-circle-fill"></i></div>
      <div class="meal-tag">Mittagessen <i class="bi bi-plus-circle-fill"></i></div>
      <div class="meal-tag">Abendessen <i class="bi bi-plus-circle-fill"></i></div>
      <div class="meal-tag">Snacks <i class="bi bi-plus-circle-fill"></i></div>
    </div>

    <!-- Footer: "Übersicht" ist aktiv -->
    <footer class="footer">
      <a href="index.html" class="nav-item active">
          <i class="fa-solid fa-chart-column"></i>
          <span>Übersicht</span>
      </a>
      
      <a href="lebensmittel.html" class="nav-item">
          <i class="fa-solid fa-bars"></i>
          <span>Lebensmittel</span>
      </a>
      
      <a href="#profil" class="nav-item">
          <i class="fa-solid fa-user"></i>
          <span>Profil</span>
      </a>
    </footer>
  </div>
</body>
</html>
